<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Táctico de Incendios Forestales</title>

    <!-- 1. CSS de Leaflet (Debe ir ANTES de tus estilos) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 2. Tu diseño -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <h1>Simulador Táctico de Propagación</h1>

    <!-- Contenedor general para agrupar mapa y panel -->
    <div id="contenedor-principal" style="position: relative; width: 90%; max-width: 1200px; margin: 0 auto;">

        <!-- El mapa -->
        <div id="mapa" style="width: 100%; height: 650px; border: 3px solid #485460; border-radius: 8px;"></div>

        <!-- El panel de control táctico flotante -->
        <div id="panel-control">
            <h3>Condiciones Tácticas</h3>

            <label>Combustible:</label>
            <select id="input-combustible">
                <option value="pastizal">Pastizal (Rápido)</option>
                <option value="matorral">Matorral (Medio)</option>
                <option value="bosque">Bosque Denso (Lento)</option>
            </select>

            <label>Viento: <span id="valor-viento">20</span> km/h</label>
            <input type="range" id="input-viento" min="0" max="100" value="20">

            <label>Humedad: <span id="valor-humedad">15</span> %</label>
            <input type="range" id="input-humedad" min="2" max="100" value="15">

            <label>Pendiente: <span id="valor-pendiente">0</span> %</label>
            <input type="range" id="input-pendiente" min="0" max="100" value="0">
        </div>
    </div>

    <!-- 4. JS de Leaflet (Debe ir ANTES de tu motor matemático) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 5. Tu motor lógico y cartográfico -->
    <script src="motor.js"></script>
</body>

</html>
